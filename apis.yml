name: Babel Finance
description: 'Babel Finance was a Hong Kong-based crypto financial services provider offering crypto
  asset lending and borrowing, asset management, brokerage and derivatives trading, and mining-related
  financing to institutional and high-net-worth clients. It reached a USD 2B valuation on an USD 80M
  Series B in May 2022 with backing that included Multicoin Capital, then froze customer redemptions
  and withdrawals weeks later in June 2022 amid the Three Arrows Capital and Celsius contagion. The
  company disclosed roughly USD 766M in losses, pursued a Singapore court moratorium and a scheme of
  arrangement, and floated a crypto-backed stablecoin to repay creditors. As of this enrichment pass
  the company is listed as permanently closed and its primary domain babel.finance no longer resolves
  (no NS delegation), so there is no live developer portal, documentation, or API surface to catalog.
  This profile is retained as a historical record of a defunct crypto-lending provider.'
